<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Rui &amp; Filipa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&family=Inter+Tight:wght@200;300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* ================================================================
   Rui & Filipa · 17 out 2026
   Head no modelo ykproduce.co.jp (sem menu), com alianças e transição luma até ao vídeo.
   Tudo o que muda vive no objeto CASAMENTO, no início do <script>.
   Testes: ?rapido=1 (3x mais rápido) · ?saltar=1 (vai direto às fotografias)
   ================================================================ */
:root{
  --red:#c4212a;
  --hn:"Helvetica Neue",Helvetica,"Inter Tight",Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,monospace;
  --pad:23px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:#fff;color:#000;font-family:var(--hn);-webkit-font-smoothing:antialiased;overflow-x:clip}
body.preso{overflow:hidden;height:100svh}
img,video,canvas{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ================= CARREGAMENTO ================= */
.loading{position:fixed;top:0;left:0;width:100%;height:100svh;background:#000;color:#fff;z-index:999;overflow:hidden;cursor:default}
.aneis{position:absolute;top:50%;left:50%;width:clamp(104px,9.5vw,142px);opacity:0;will-change:transform,filter}
.aneis svg{width:100%;height:auto;overflow:visible}

/* letra fina e cinematográfica; cada letra entra e sai com desfoque */
.frase{font-family:var(--hn);font-weight:200;font-size:clamp(23px,2.8vw,40px);line-height:1.25;letter-spacing:.01em;color:#fff;text-align:center}
.frase .w,.mv__final h2 .w{display:inline-block;white-space:nowrap}
.frase .c,.mv__final h2 .c{display:inline-block;will-change:transform,filter,opacity}
.loading__frase{position:absolute;left:var(--pad);right:var(--pad);top:calc(50% + clamp(70px,6.5vw,96px))}
.loading__toca{position:absolute;left:var(--pad);right:var(--pad);top:calc(50% + clamp(70px,6.5vw,96px));text-align:center;font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;opacity:0;pointer-events:none}
.loading__toca span{display:block;margin-top:10px;color:rgba(255,255,255,.5);font-size:11px}

.loading__progress{position:absolute;left:var(--pad);bottom:53px;width:calc(100% - var(--pad) * 2);min-height:40px}
.loading__num{position:absolute;left:0;bottom:0;font-size:clamp(24px,2.93vw,44px);font-weight:300;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.loading__main{position:absolute;left:22px;bottom:-44px;width:2px;height:8px;background:var(--red)}
.regua{position:absolute;left:var(--pad);bottom:var(--pad);width:calc(100% - var(--pad) * 2);height:14px;border-bottom:1px solid rgba(255,255,255,.3);overflow:hidden}
.regua i{position:absolute;bottom:1px;width:1px;height:3px;background:#fff;opacity:.3}
.regua b{position:absolute;bottom:0;width:1px;height:14px;background:rgba(255,255,255,.3)}
.regua b.l{left:0}.regua b.r{right:0}

/* sequência luma: as fotografias entram pela luz e a última abre-se para o vídeo */
.luma{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
/* véu por cima das fotografias: centro e fundo mais escuros para as alianças, as frases e a régua */
.loading__veu{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 65% at 50% 54%,rgba(0,0,0,.6) 0%,rgba(0,0,0,.42) 55%,rgba(0,0,0,.3) 100%),linear-gradient(to top,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 26%)}
.loading__frase{text-shadow:0 0 28px rgba(0,0,0,.55)}
.luma-css{position:absolute;inset:0;opacity:0;pointer-events:none}
.luma-css img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}

/* ================= HEAD ================= */
.mv{position:relative;height:100svh;background:#000;overflow:hidden;color:#fff;transition:height 1.4s cubic-bezier(.76,0,.24,1)}
.mv[hidden]{display:none}
/* capa da head seguinte: um fotograma escurecido que se vê enquanto ela sobe e se dissolve quando o vídeo começa */
.mv__capa{position:absolute;inset:0;z-index:1;pointer-events:none}
.mv__capa img{width:100%;height:100%;object-fit:cover;filter:brightness(.5) contrast(1.05);transform:scale(1.06)}
.mv__video{position:absolute;inset:0}
.mv__video video{width:100%;height:100%;object-fit:cover}
/* telemóvel na vertical: o filme aparece inteiro, para não cortar as legendas do Rui */
@media (orientation:portrait){.mv__video video{object-fit:contain}}
.vira{position:absolute;left:0;right:0;top:calc(50% + 31vw);z-index:4;display:none;flex-direction:column;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);opacity:0;pointer-events:none}
.vira svg{width:26px;height:26px;animation:vira 2.4s cubic-bezier(.76,0,.24,1) infinite}
@keyframes vira{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait){.vira{display:flex}}
.mv__escuro{position:absolute;inset:0;background:#000;opacity:0;z-index:1;pointer-events:none}

.logo{position:absolute;top:calc(var(--pad) + 5px);left:var(--pad);z-index:6;display:flex;align-items:center;gap:12px;color:#fff;mix-blend-mode:difference;opacity:0;text-decoration:none}
.logo svg{width:clamp(30px,2.6vw,38px);height:auto}
.logo span{font-weight:400;font-size:clamp(14px,1.35vw,19px);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}

.toque{position:absolute;inset:0;z-index:3;display:none}
.mv.a-tocar .toque{display:block}
.estado{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .4s}
.estado.on{opacity:1}

/* régua do vídeo: o traço vermelho acompanha o tempo, como no carregamento */
.mv__barra{position:absolute;left:0;right:0;bottom:0;height:90px;z-index:4;opacity:0;pointer-events:none}
.mv__progresso{position:absolute;left:var(--pad);bottom:53px;width:calc(100% - var(--pad) * 2);min-height:20px}
.mv__tempo{position:absolute;left:0;bottom:0;font-family:var(--mono);font-size:12px;letter-spacing:-.03em;line-height:1}
.mv__main{position:absolute;left:0;bottom:-44px;width:2px;height:8px;background:var(--red)}
.mv__som{position:absolute;right:var(--pad);top:calc(var(--pad) + 5px);z-index:6;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:none;border-bottom:1px solid #fff;padding-bottom:2px}
.mv.sem-som .mv__som{display:block}

.mv__frase{position:absolute;left:var(--pad);right:var(--pad);top:50%;transform:translateY(-50%);z-index:3;pointer-events:none}
.mv__final{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--pad);pointer-events:none;visibility:hidden}
.mv__final.on{visibility:visible}
.mv__final h2{font-weight:200;font-size:clamp(40px,5.6vw,80px);line-height:1.08;letter-spacing:-.01em}
.mv__final p{margin-top:26px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:0}
.descer{position:absolute;left:50%;bottom:var(--pad);transform:translateX(-50%);z-index:4;width:1px;height:40px;background:rgba(255,255,255,.3);overflow:hidden;opacity:0}
.descer::after{content:"";position:absolute;left:0;top:-50%;width:1px;height:50%;background:var(--red);animation:cai 1.8s cubic-bezier(.76,0,.24,1) infinite}
@keyframes cai{to{top:110%}}

/* cartão "ver outra vez", igual ao Play Showreel */
.reel{position:absolute;right:20px;bottom:80px;z-index:6;display:flex;gap:16px;width:min(300px,calc(100% - 40px));background:#000;border-radius:3px;padding:7px;text-align:left;opacity:0;pointer-events:none}
.reel.on{pointer-events:auto}
.reel__video{width:136px;height:77px;border-radius:3px;overflow:hidden;position:relative;flex:none}
.reel__video img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.reel:hover .reel__video img{transform:scale(1.08)}
.reel__video svg{position:absolute;top:50%;left:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
.reel__textos{padding-block:7px;flex:1;position:relative;min-width:110px}
.reel__titulo{display:block;font-family:var(--mono);font-size:12px;font-weight:500;line-height:1.2;margin-bottom:9px}
.reel__tempo{display:block;font-family:var(--mono);font-size:12px;font-weight:500;line-height:1.2;letter-spacing:-.03em}
.reel__seta{position:absolute;right:12px;bottom:6px;width:11px}

/* escala vertical à direita, presa ao scroll */
.escala{position:fixed;top:34.2%;right:40px;z-index:50;width:0;height:300px;mix-blend-mode:difference;opacity:0;pointer-events:none;transition:opacity 1s}
.escala i{position:absolute;right:0;width:4px;height:1px;background:#fff;opacity:.2}
.escala__main{position:fixed;top:34.2%;right:40px;z-index:51;width:0;opacity:0;pointer-events:none;transition:opacity 1s}
.escala__main span{position:absolute;top:0;right:-22px;width:14px;height:2px;background:var(--red)}
body.livre .escala,body.livre .escala__main{opacity:1}

@media (max-width:767px){
  .loading__main{left:14px}
  .escala,.escala__main{right:21px}
  .escala__main span{width:10px;right:-18px}
  .reel{left:20px;right:auto;bottom:74px;width:auto}
  .reel__video{width:112px;height:63px}
}
</style>
</head>
<body class="preso">

<!-- ================= CARREGAMENTO ================= -->
<div class="loading" id="loading">
  <canvas class="luma" id="luma"></canvas>
  <div class="luma-css" id="lumaCss"></div>
  <div class="loading__veu" id="veu"></div>
  <div class="aneis" id="aneis"></div>
  <p class="frase loading__frase" id="fraseLoading" aria-live="polite"></p>
  <div class="loading__toca" id="toca">Toca no ecrã para ver<span>Liga o som</span></div>
  <div class="loading__progress" data-fade>
    <p class="loading__num" id="num">00</p>
    <div class="loading__main" id="main"></div>
  </div>
  <div class="regua" id="reguaLoading" data-fade><b class="l"></b><b class="r"></b></div>
</div>

<!-- ================= HEADS · uma por vídeo, a seguinte abre quando a anterior acaba ================= -->
<div id="heads"></div>

<script>
/* ================================================================
   CONFIGURAÇÃO · trocar aqui
   ================================================================ */
const n2 = n => String(n).padStart(2, '0');
const CASAMENTO = {
  noivo: 'Rui',
  noiva: 'Filipa',
  data: '17.10.2026',
  local: 'Outubro 2026',

  // Vídeos, um por head, por esta ordem. Quando um acaba, abre-se a head seguinte por baixo e toca o próximo.
  // O pequeno entra nos telemóveis e tablets, o grande nos computadores.
  videos: [
    { grande: 'media/video/vestido-1080.mp4', pequeno: 'media/video/vestido-720.mp4', poster: 'media/video/vestido-poster.jpg' }, // prova do vestido, 42,5 s
    { grande: 'media/video/shorty-1080.mp4',  pequeno: 'media/video/shorty-720.mp4',  poster: 'media/video/shorty-poster.jpg' }   // shorty do casamento, 45,5 s
  ],

  // Frases durante o carregamento (o vídeo não tem falas)
  frasesAntes: [
    'Antes do sim, houve este dia.',
    'O teu vestido, linha a linha.',
    'Ainda falta o melhor.'
  ],
  // Frases depois do vídeo. Vazio = passa direto ao fecho da head.
  frasesDepois: [],

  // Fundo do carregamento: o primeiro plano do vídeo, escurecido (luz no início e no fim do carregamento).
  // Depois do toque ganha luz e dissolve-se no vídeo, que começa neste mesmo plano.
  fundo: 'media/video/vestido-inicio.jpg',
  luzFundo: [.22, .3]
};

/* ================================================================ */
const Q = new URLSearchParams(location.search);
const VEL = Q.has('rapido') ? 1 / 3 : 1;
if (VEL !== 1) gsap.globalTimeline.timeScale(1 / VEL);
const $ = s => document.querySelector(s);
const espera = ms => new Promise(r => setTimeout(r, ms * VEL));
const mobile = () => innerWidth < 767;
const retrato = innerHeight > innerWidth;
const loading = $('#loading');

/* ---------- alianças ----------
   Duas alianças finas em ouro branco polido, com reflexos duros, um diamante e brilhos.
   Começam apagadas e acendem com o carregamento. */
const A = { cx: 95, cy: 100 }, B = { cx: 145, cy: 100 }, R = 62;
function aneis() {
  const metal = (id, x1, y1, x2, y2) => `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1c1c"/><stop offset=".14" stop-color="#f7f7f7"/><stop offset=".22" stop-color="#7e7e7e"/>
      <stop offset=".38" stop-color="#ffffff"/><stop offset=".47" stop-color="#2a2a2a"/><stop offset=".6" stop-color="#d8d8d8"/>
      <stop offset=".7" stop-color="#ffffff"/><stop offset=".82" stop-color="#5c5c5c"/><stop offset="1" stop-color="#ededed"/></linearGradient>`;
  const anel = (c, g) => `<circle cx="${c.cx}" cy="${c.cy}" r="${R}" fill="none" stroke="url(#${g})" stroke-width="6.5"/>
    <circle cx="${c.cx}" cy="${c.cy}" r="${R - 2.4}" fill="none" stroke="rgba(255,255,255,.9)" stroke-width=".6"/>
    <circle cx="${c.cx}" cy="${c.cy}" r="${R + 3}" fill="none" stroke="rgba(0,0,0,.6)" stroke-width=".6"/>`;
  const estrela = (x, y, s, id) => `<path id="${id}" class="glint" d="M${x} ${y - s} L${x + s * .18} ${y - s * .18} L${x + s} ${y} L${x + s * .18} ${y + s * .18} L${x} ${y + s} L${x - s * .18} ${y + s * .18} L${x - s} ${y} L${x - s * .18} ${y - s * .18} Z" fill="#fff" opacity="0"/>`;
  return `<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    ${metal('metalA', 33, 38, 157, 162)}${metal('metalB', 207, 38, 83, 162)}
    <linearGradient id="brilho" x1="0" y1="0" x2="34" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="translate(-80 0) rotate(-28)">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pedra" x1="-7" y1="-7" x2="7" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#e9edf2"/><stop offset=".7" stop-color="#9aa3ad"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="cruza"><circle cx="120" cy="43.3" r="11"/></clipPath>
  </defs>
  <g>${anel(A, 'metalA')}</g>
  <g>${anel(B, 'metalB')}</g>
  <g clip-path="url(#cruza)">${anel(A, 'metalA')}</g>
  <g id="aneisBrilho" opacity="0">
    <circle cx="${A.cx}" cy="${A.cy}" r="${R}" fill="none" stroke="url(#brilho)" stroke-width="6.5"/>
    <circle cx="${B.cx}" cy="${B.cy}" r="${R}" fill="none" stroke="url(#brilho)" stroke-width="6.5"/>
  </g>
  <g transform="translate(190.2 45.6) rotate(40)">
    <polygon points="-6.5,-1.6 -4,-5.8 4,-5.8 6.5,-1.6 0,7.5" fill="url(#pedra)"/>
    <path d="M-6.5,-1.6 H6.5 M-4,-5.8 L-1.6,-1.6 L0,7.5 L1.6,-1.6 L4,-5.8 M-1.6,-1.6 L0,-5.8 L1.6,-1.6" fill="none" stroke="rgba(255,255,255,.85)" stroke-width=".4"/>
  </g>
  ${estrela(194, 30, 7, 'g1')}${estrela(52, 62, 4.5, 'g2')}${estrela(176, 150, 4, 'g3')}${estrela(118, 41, 3.5, 'g4')}
</svg>`;
}
function aneisTraco(w = 7) {
  return `<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#fff" stroke-width="${w}">
  <circle cx="${A.cx}" cy="${A.cy}" r="${R}"/><circle cx="${B.cx}" cy="${B.cy}" r="${R}"/></svg>`;
}
$('#aneis').innerHTML = aneis();

/* ================================================================
   HEADS · cada vídeo tem a sua: leitor, régua com o tempo, fecho e "Ver outra vez"
   ================================================================ */
const nomes = `${CASAMENTO.noivo} & ${CASAMENTO.noiva}`;
const ecraPequeno = Math.min(screen.width, screen.height) < 820 || matchMedia('(pointer:coarse)').matches;
const mmss = s => `${n2(Math.floor(s / 60))}:${n2(Math.floor(s % 60))}`;
const htmlHead = i => `
<header class="mv" id="mv${i}"${i ? ' hidden' : ''}>
  <div class="mv__video"><video playsinline webkit-playsinline preload="auto"></video></div>${i ? '<div class="mv__capa"><img alt=""></div>' : ''}
  <div class="vira"><svg viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="1.2"><rect x="8" y="3" width="10" height="20" rx="2"/><path d="M12 19.5h2"/></svg>Vira o telemóvel para ver maior</div>
  <div class="mv__escuro"></div>
  <a class="logo"><span class="logo__s"></span><span class="logo__nome"></span></a>
  <button class="mv__som">Ligar o som</button>
  <div class="toque"></div>
  <p class="estado"></p>
  <div class="mv__barra">
    <div class="mv__progresso"><p class="mv__tempo">00:00</p><div class="mv__main"></div></div>
    <div class="regua"><b class="l"></b><b class="r"></b></div>
  </div>
  <p class="frase mv__frase"></p>
  <div class="mv__final"><h2></h2><p></p></div>
  <button class="reel" aria-label="Ver outra vez">
    <span class="reel__video"><img alt=""><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="rgba(0,0,0,.45)"/><path d="M8 6v8l6-4z" fill="#fff"/></svg></span>
    <span class="reel__textos">
      <span class="reel__titulo">Ver outra vez</span>
      <span class="reel__tempo">00:00</span>
      <svg class="reel__seta" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.2"><path d="M2 10 10 2M4 2h6v6"/></svg>
    </span>
  </button>
</header>`;
$('#heads').innerHTML = CASAMENTO.videos.map((_, i) => htmlHead(i)).join('');
document.querySelectorAll('.logo__s').forEach(e => e.outerHTML = aneisTraco(12));
document.querySelectorAll('.logo__nome').forEach(e => e.textContent = nomes);

let wakeLock = null;
async function manterEcra() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {} }

function criaHead(sec, cfg, i) {
  const q = s => sec.querySelector(s);
  const v = q('video');
  const h = { sec, i, q, video: v, tracos: [], aTocar: false, porScroll: false };
  v.src = ecraPequeno ? cfg.pequeno : cfg.grande;
  v.poster = cfg.poster;
  q('.reel__video img').src = cfg.poster;
  if (q('.mv__capa img')) q('.mv__capa img').src = cfg.poster;
  v.addEventListener('loadedmetadata', () => { q('.reel__tempo').textContent = mmss(v.duration); });

  h.tocar = () => {
    // só toca um vídeo de cada vez
    heads.forEach(o => { if (o !== h && !o.video.paused) { o.video.pause(); o.aTocar = false; o.sec.classList.remove('a-tocar'); } });
    h.aTocar = true; h.porScroll = false;
    v.currentTime = 0;
    v.muted = false;
    sec.classList.add('a-tocar');
    const capa = q('.mv__capa');
    if (capa && +getComputedStyle(capa).opacity > 0) gsap.to(capa, { opacity: 0, filter: 'blur(10px)', duration: 1.6, delay: .2, ease: 'power2.inOut' });
    v.play().catch(() => { v.muted = true; sec.classList.add('sem-som'); v.play().catch(() => {}); });
    manterEcra();
    if (!h.tracos.length) h.tracos = fazRegua(q('.mv__barra .regua'));
    if (matchMedia('(orientation:portrait)').matches) {
      gsap.fromTo(q('.vira'), { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 1.2, delay: 2.4, ease: 'power3.out' });
      gsap.to(q('.vira'), { opacity: 0, filter: 'blur(8px)', duration: 1, delay: 7.5, ease: 'power2.in' });
    }
  };

  h.desenha = () => {
    if (v.duration) {
      const k = v.currentTime / v.duration, w = q('.mv__progresso').clientWidth, t = q('.mv__tempo');
      q('.mv__main').style.left = (k * (w - 2)) + 'px';
      t.textContent = mmss(v.duration - v.currentTime);
      t.style.left = Math.min(w - t.offsetWidth, Math.max(0, k * w - t.offsetWidth / 2)) + 'px';
      acende(h.tracos, q('.mv__barra .regua'), q('.mv__main'));
    }
    if (h.aTocar && !v.paused) requestAnimationFrame(h.desenha);
  };
  v.addEventListener('play', () => requestAnimationFrame(h.desenha));

  q('.mv__som').addEventListener('click', e => { e.stopPropagation(); v.muted = false; sec.classList.remove('sem-som'); if (v.paused) v.play(); });
  q('.toque').addEventListener('click', () => {
    if (v.muted) { v.muted = false; sec.classList.remove('sem-som'); }
    else if (v.paused) v.play(); else v.pause();
    const e = q('.estado');
    e.textContent = v.paused ? 'Pausa · toca para continuar' : '';
    e.classList.toggle('on', v.paused);
  });

  // fim do vídeo: se houver head seguinte, abre-a e toca o próximo; senão, fecho com os nomes
  v.addEventListener('ended', async () => {
    if (!h.aTocar) return;
    h.aTocar = false;
    sec.classList.remove('a-tocar');
    gsap.to(q('.mv__barra'), { opacity: 0, duration: .8 });
    const seguinte = heads[i + 1];
    if (seguinte) {
      gsap.to(q('.mv__escuro'), { opacity: .62, duration: 1.6, ease: 'power2.out' });
      mostraReel(h, .6);
      return abre(seguinte);
    }
    try { wakeLock && wakeLock.release(); } catch (e) {}
    await gsap.to(q('.mv__escuro'), { opacity: .62, duration: 1.6, ease: 'power2.out' });
    const el = q('.mv__frase');
    for (const f of CASAMENTO.frasesDepois) {
      const chars = parte(el, f);
      await entra(chars);
      await espera(1300);
      await sai(chars);
      await espera(200);
    }
    el.innerHTML = '';
    mostraFinal(h);
  });

  q('.reel').addEventListener('click', async () => {
    q('.reel').classList.remove('on');
    gsap.to([q('.mv__final'), q('.reel')], { opacity: 0, duration: .5, onComplete: () => q('.mv__final').classList.remove('on') });
    gsap.to(q('.mv__escuro'), { opacity: 0, duration: 1 });
    gsap.to(q('.mv__barra'), { opacity: .9, duration: 1 });
    await vai(h);
    h.tocar();
  });
  return h;
}
const heads = CASAMENTO.videos.map((cfg, i) => criaHead($('#mv' + i), cfg, i));
const H1 = heads[0];

function mostraReel(h, atraso = 1.4) {
  gsap.fromTo(h.q('.reel'), { opacity: 0, y: 14, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.2, delay: atraso, ease: 'power4.out', onStart: () => h.q('.reel').classList.add('on') });
}
function mostraFinal(h) {
  const fin = h.q('.mv__final');
  fin.classList.add('on');
  gsap.set(fin, { opacity: 1 });
  entra(parte(h.q('.mv__final h2'), nomes));
  h.q('.mv__final p').textContent = CASAMENTO.data;
  gsap.fromTo(h.q('.mv__final p'), { opacity: 0, filter: 'blur(8px)' }, { opacity: .85, filter: 'blur(0px)', duration: 1.4, delay: .9, ease: 'power3.out' });
  mostraReel(h);
}

// desce (ou sobe) até uma head, com desfoque de movimento a acompanhar a velocidade
function vai(h) {
  const y0 = scrollY, y1 = h.sec.offsetTop;
  if (Math.abs(y1 - y0) < 2) return Promise.resolve();
  const st = { k: 0 }, vids = document.querySelectorAll('.mv__video');
  return gsap.to(st, { k: 1, duration: 1.8, ease: 'power3.inOut', onUpdate: () => {
    scrollTo(0, y0 + (y1 - y0) * st.k);
    const b = Math.sin(Math.PI * st.k) * 9;
    vids.forEach(e => e.style.filter = b > .05 ? `blur(${b.toFixed(2)}px)` : 'none');
  }, onComplete: () => vids.forEach(e => e.style.filter = 'none') }).then(() => {});
}

// abre a head seguinte por baixo, desce até ela e toca o vídeo
async function abre(h) {
  h.sec.hidden = false;
  document.body.classList.remove('preso');
  gsap.set(h.q('.logo'), { opacity: 0 });
  gsap.set(h.q('.mv__barra'), { opacity: 0 });
  const capaImg = h.q('.mv__capa img');
  if (capaImg) gsap.fromTo(capaImg, { scale: 1.14 }, { scale: 1.02, duration: 3.2, ease: 'power2.out' });
  await espera(900);
  await vai(h);
  gsap.fromTo(h.q('.logo'), { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 1.4, ease: 'power3.out' });
  gsap.to(h.q('.mv__barra'), { opacity: .9, duration: 1.4, ease: 'power4.out' });
  h.tocar();
}

// se a pessoa sair de uma head a meio do vídeo, pausa; quando volta, continua
const ioHeads = new IntersectionObserver(es => es.forEach(e => {
  const h = heads.find(x => x.sec === e.target);
  if (!h || !h.aTocar) return;
  if (e.intersectionRatio < .5 && !h.video.paused) { h.video.pause(); h.porScroll = true; }
  else if (e.intersectionRatio >= .5 && h.porScroll) { h.porScroll = false; h.video.play().catch(() => {}); }
}), { threshold: [0, .5, 1] });
heads.forEach(h => ioHeads.observe(h.sec));

/* ================================================================
   FUNDO DO CARREGAMENTO · o primeiro plano do vídeo entra pela luz e fica escurecido
   por trás das alianças e das frases; depois do toque dissolve-se pela luz até ao vídeo
   ================================================================ */
const listaSeq = [CASAMENTO.fundo];
const imagensSeq = listaSeq.map(src => { const im = new Image(); im.decoding = 'async'; im.src = src; return im; });
const prontaImg = im => im.complete && im.naturalWidth ? Promise.resolve() : new Promise(r => { im.onload = r; im.onerror = r; });

const Luma = (() => {
  const cv = $('#luma');
  const gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
  if (!gl) return null;
  const vs = `attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
  const fs = `precision mediump float;
  varying vec2 v;
  uniform sampler2D uA,uB;
  uniform vec2 uRes,uSA,uSB;
  uniform float uP,uZA,uZB,uFim,uSoft,uLuz;
  vec2 cover(vec2 uv,vec2 img,float z){
    float rs=uRes.x/uRes.y, ri=img.x/img.y;
    vec2 s = rs>ri ? vec2(1.,ri/rs) : vec2(rs/ri,1.);
    return (uv-.5)*s/z+.5;
  }
  float luma(vec3 c){return dot(c,vec3(.299,.587,.114));}
  void main(){
    vec4 a=texture2D(uA,cover(v,uSA,uZA));
    float s=uSoft;
    if(uFim>.5){
      float t=mix(-s,1.+s,uP);
      float k=smoothstep(t-s,t+s,luma(a.rgb));
      float e=k*(1.-k)*4.;
      vec3 c=(a.rgb+vec3(1.,.95,.88)*e*.4)*uLuz;
      gl_FragColor=vec4(c*k,k);
    }else{
      vec4 b=texture2D(uB,cover(v,uSB,uZB));
      float t=mix(1.+s,-s,uP);
      float m=smoothstep(t-s,t+s,luma(b.rgb));
      float e=m*(1.-m)*4.;
      vec3 c=(mix(a.rgb,b.rgb,m)+vec3(1.,.95,.88)*e*.3)*uLuz;
      gl_FragColor=vec4(c,1.);
    }
  }`;
  const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
  gl.useProgram(pr);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  ['uA', 'uB', 'uRes', 'uSA', 'uSB', 'uP', 'uZA', 'uZB', 'uFim', 'uSoft', 'uLuz'].forEach(n => U[n] = gl.getUniformLocation(pr, n));
  gl.uniform1i(U.uA, 0); gl.uniform1i(U.uB, 1);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  function textura(fonte) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    if (fonte) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fonte);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return { t, w: fonte ? fonte.naturalWidth : 1, h: fonte ? fonte.naturalHeight : 1 };
  }
  function tamanho() {
    const d = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
    gl.viewport(0, 0, cv.width, cv.height);
  }
  tamanho();
  addEventListener('resize', tamanho);
  function desenha(a, b, p, za, zb, fim, luz = 1) {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, a.t);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, (b || a).t);
    gl.uniform2f(U.uRes, cv.width, cv.height);
    gl.uniform2f(U.uSA, a.w, a.h); gl.uniform2f(U.uSB, (b || a).w, (b || a).h);
    gl.uniform1f(U.uP, p); gl.uniform1f(U.uZA, za); gl.uniform1f(U.uZB, zb);
    gl.uniform1f(U.uFim, fim ? 1 : 0); gl.uniform1f(U.uSoft, .16); gl.uniform1f(U.uLuz, luz);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  return { cv, textura, desenha };
})();

// cada fotografia aproxima-se devagar desde que entra (movimento contínuo)
const zoom = nasceu => 1 + .12 * Math.exp(-(performance.now() - nasceu) / (3600 * VEL));
// pequeno desfoque de foco no meio de cada troca
const foco = (el, p, max = 3.5) => { const b = Math.sin(Math.PI * p) * max; el.style.filter = b > .05 ? `blur(${b.toFixed(2)}px)` : 'none'; };

const fundo = { a: null, b: null, p: 0, nA: 0, nB: 0, luz: CASAMENTO.luzFundo[0], fim: false, ativo: false };
function desenhaFundo() {
  if (!Luma || !fundo.ativo || !fundo.a) return;
  Luma.desenha(fundo.a, fundo.b || fundo.a, fundo.p, zoom(fundo.nA), zoom(fundo.b ? fundo.nB : fundo.nA), fundo.fim, fundo.luz);
  foco(Luma.cv, fundo.fim ? fundo.p * .6 : (fundo.b ? fundo.p : 0));
}
const texturas = [];
if (Luma) imagensSeq.forEach((im, i) => prontaImg(im).then(() => { if (im.naturalWidth) texturas[i] = Luma.textura(im); }));
const textura = i => new Promise(r => { const t = () => texturas[i] ? r(texturas[i]) : setTimeout(t, 60); t(); });

// as fotografias passam ao longo de todo o carregamento e acendem com as alianças
async function fotosNoCarregamento(total) {
  const n = imagensSeq.length, slot = total / n, troca = Math.min(1.6, slot * .62);
  if (!Luma) return fotosCss(total);
  fundo.a = Luma.textura(null); fundo.nA = performance.now(); fundo.ativo = true;
  gsap.ticker.add(desenhaFundo);
  gsap.set(Luma.cv, { opacity: 1 });
  gsap.to(fundo, { luz: CASAMENTO.luzFundo[1], duration: total, ease: 'power1.in' });
  for (let i = 0; i < n; i++) {
    const t0 = performance.now();
    fundo.b = await textura(i); fundo.nB = performance.now(); fundo.p = 0;
    await gsap.to(fundo, { p: 1, duration: troca, ease: 'power2.inOut' });
    fundo.a = fundo.b; fundo.nA = fundo.nB; fundo.b = null; fundo.p = 0;
    const resto = slot * 1000 * VEL - (performance.now() - t0);
    if (i < n - 1 && resto > 0) await new Promise(r => setTimeout(r, resto));
  }
}
// depois do toque: a fotografia ganha luz e dissolve-se pela luz até ao vídeo, que já está a falar
async function fotosParaVideo() {
  if (!Luma) return fotosCssParaVideo();
  await gsap.to(fundo, { luz: 1, duration: 1.1, ease: 'power2.inOut' });
  loading.style.background = 'transparent';
  H1.tocar();
  fundo.fim = true; fundo.p = 0;
  await gsap.to(fundo, { p: 1, duration: 2.2, ease: 'power2.inOut' });
  fundo.ativo = false;
  gsap.ticker.remove(desenhaFundo);
}

// sem WebGL: as mesmas fotografias em fundido com desfoque
async function fotosCss(total) {
  const box = $('#lumaCss'), slot = total / listaSeq.length;
  box.innerHTML = listaSeq.map(s => `<img src="${s}" alt="">`).join('');
  const ims = [...box.querySelectorAll('img')];
  gsap.set(box, { opacity: 1 });
  for (let i = 0; i < ims.length; i++) {
    gsap.fromTo(ims[i], { opacity: 0, scale: 1.12, filter: 'blur(10px) brightness(.25)' }, { opacity: 1, scale: 1, filter: 'blur(0px) brightness(.25)', duration: slot + 1.5, ease: 'power2.out' });
    if (i < ims.length - 1) await espera(slot * 1000);
  }
}
async function fotosCssParaVideo() {
  const box = $('#lumaCss');
  await gsap.to(box.querySelectorAll('img'), { filter: 'blur(0px) brightness(1)', duration: 1.1 });
  loading.style.background = 'transparent';
  H1.tocar();
  await gsap.to(box, { opacity: 0, filter: 'blur(14px) brightness(1.8)', duration: 2, ease: 'power2.inOut' });
}

/* ---------- réguas ---------- */
function fazRegua(el) {
  el.querySelectorAll('i').forEach(t => t.remove());
  const w = el.clientWidth, lista = [];
  for (let x = 6; x < w; x += 6) {
    const t = document.createElement('i');
    t.style.left = x + 'px';
    el.appendChild(t);
    lista.push([x, t]);
  }
  return lista;
}
// traços perto do marcador crescem de 3 para 9 px e acendem (mesma fórmula da referência)
function acende(tracos, regua, marca) {
  if (!tracos.length) return;
  const r = marca.getBoundingClientRect(), mx = r.left + r.width / 2 - regua.getBoundingClientRect().left;
  for (const [x, t] of tracos) {
    const s = Math.max(0, 1 - Math.abs(mx - x) / 20);
    t.style.height = (3 + 6 * s) + 'px';
    t.style.opacity = .3 + .7 * s;
  }
}
let tracosLoading = fazRegua($('#reguaLoading'));
let tracosRodape = [];

/* ---------- contador, marcador vermelho e luz das alianças ---------- */
const prog = { p: 0 };
const aneisEl = $('#aneis');
function desenhaProgresso() {
  const p = prog.p, k = p / 100, m = mobile();
  $('#num').textContent = n2(Math.floor(p));
  $('#num').style.left = (p * (m ? .87 : .95)) + '%';
  const ini = m ? 14 : 22, fim = m ? 94 : 98;
  $('#main').style.left = `calc(${ini}px + (${fim}% - ${ini}px) * ${k})`;
  acende(tracosLoading, $('#reguaLoading'), $('#main'));
  // as alianças acendem: de quase negras a ouro branco polido com halo
  const luz = .06 + 1.1 * Math.pow(k, 1.2);
  aneisEl.style.filter = `brightness(${luz.toFixed(3)}) contrast(${(1 + .25 * k).toFixed(3)}) drop-shadow(0 0 ${(k * 7).toFixed(1)}px rgba(255,255,255,${(k * .55).toFixed(3)}))`;
  $('#aneisBrilho').setAttribute('opacity', Math.min(1, k * 1.2).toFixed(3));
  const g = Math.max(0, (k - .45) / .55);
  document.querySelectorAll('.glint').forEach(e => e.style.setProperty('--g', g));
}
desenhaProgresso();

// reflexo que atravessa as alianças em ciclo
const brilho = { x: -80 };
gsap.to(brilho, { x: 300, duration: 2.6, ease: 'power2.inOut', repeat: -1, repeatDelay: .9, onUpdate: () => {
  const g = document.getElementById('brilho');
  if (g) g.setAttribute('gradientTransform', `translate(${brilho.x} 0) rotate(-28)`);
} });
// brilhos pequenos que acendem e apagam em tempos diferentes
document.querySelectorAll('.glint').forEach((e, i) => {
  gsap.set(e, { transformOrigin: '50% 50%', scale: .2 });
  gsap.to(e, { scale: 1, rotate: 45, duration: .7, ease: 'sine.inOut', yoyo: true, repeat: -1, repeatDelay: .4 + i * .55, delay: i * .8,
    onUpdate() {
      const g = parseFloat(e.style.getPropertyValue('--g')) || 0;
      e.setAttribute('opacity', (((gsap.getProperty(e, 'scale') - .2) / .8) * g).toFixed(3));
    } });
});

/* ---------- frases letra a letra, com desfoque ---------- */
function parte(el, texto) {
  el.innerHTML = texto.split(' ').map(w => `<span class="w">${[...w].map(c => `<span class="c">${c}</span>`).join('')}</span>`).join(' ');
  return el.querySelectorAll('.c');
}
function entra(chars, atraso = 0) {
  return gsap.fromTo(chars,
    { opacity: 0, yPercent: 45, scaleY: 1.35, filter: 'blur(14px)' },
    { opacity: 1, yPercent: 0, scaleY: 1, filter: 'blur(0px)', duration: 1.6, delay: atraso, ease: 'power3.out', stagger: { from: 'start', each: .028 } });
}
function sai(chars) {
  return gsap.to(chars, { opacity: 0, yPercent: -35, scaleY: 1.3, filter: 'blur(16px)', duration: .95, ease: 'power2.in', stagger: { from: 'start', each: .016 } });
}

/* ---------- som: o primeiro toque desbloqueia o vídeo (iPhone e Chrome exigem um toque) ---------- */
let desbloqueado = false;
function desbloqueia() {
  if (desbloqueado) return;
  desbloqueado = true;
  // todos os vídeos ficam desbloqueados no mesmo toque, para o segundo também poder tocar com som
  heads.forEach(h => {
    const v = h.video;
    v.muted = false;
    const p = v.play();
    if (p) p.then(() => { if (!h.aTocar) { v.pause(); v.currentTime = 0; } }).catch(() => { if (h === H1) desbloqueado = false; });
  });
}
loading.addEventListener('click', desbloqueia);
loading.addEventListener('touchend', desbloqueia, { passive: true });

/* ================================================================
   SEQUÊNCIA · carregamento linear com as frases do Rui e as fotografias por trás,
   depois a última fotografia abre-se para o vídeo
   ================================================================ */
const DUR_FRASE = 3000;
async function carregar() {
  gsap.set(aneisEl, { xPercent: -50, yPercent: -50, rotate: -20 });
  await espera(500);
  gsap.to(aneisEl, { opacity: 1, duration: 2, ease: 'power4.out' });
  await espera(800);

  const frases = CASAMENTO.frasesAntes, total = frases.length * DUR_FRASE / 1000;
  // o contador anda sempre ao mesmo ritmo, sem paragens
  gsap.to(prog, { p: 100, duration: total, ease: 'none', onUpdate: desenhaProgresso });
  gsap.to(aneisEl, { rotate: 0, duration: total, ease: 'power1.inOut' });
  const fotos = fotosNoCarregamento(total);

  const el = $('#fraseLoading');
  for (const f of frases) {
    const chars = parte(el, f);
    entra(chars);
    await espera(DUR_FRASE - 1150);
    await sai(chars);
    await espera(200);
  }
  el.innerHTML = '';
  await fotos;
  await espera(150);

  // a 100: se ainda não houve toque, pede um (sem toque o telemóvel não deixa tocar com som)
  if (!desbloqueado) {
    gsap.fromTo('#toca', { opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0px)', duration: 1.2, ease: 'power3.out' });
    const pulso = gsap.to(aneisEl, { scale: 1.06, duration: 1.3, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    await new Promise(res => {
      const ok = () => { desbloqueia(); res(); };
      loading.addEventListener('click', ok, { once: true });
      loading.addEventListener('touchend', ok, { once: true, passive: true });
    });
    pulso.kill();
    gsap.to('#toca', { opacity: 0, filter: 'blur(10px)', duration: .7 });
  }

  // saída: as alianças afastam-se e desfocam, a régua e o véu apagam
  gsap.to(aneisEl, { scale: .55, rotate: 20, opacity: 0, duration: 1.6, ease: 'power3.inOut' });
  gsap.to('#aneis svg', { filter: 'blur(10px)', duration: 1.4, ease: 'power2.in' });
  gsap.to('[data-fade]', { opacity: 0, pointerEvents: 'none', duration: 1.2, ease: 'power3.out' });
  gsap.to('#veu', { opacity: 0, duration: 1.4, ease: 'power2.inOut' });
  await espera(500);
  await fotosParaVideo();

  loading.remove();
  gsap.fromTo(H1.q('.logo'), { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 1.4, ease: 'power3.out' });
  gsap.to(H1.q('.mv__barra'), { opacity: .9, duration: 1.4, ease: 'power4.out' });
}

/* ---------- modo de teste: ?saltar=1 ---------- */
function saltar() {
  loading.remove();
  document.body.classList.remove('preso');
  heads.forEach((h, i) => {
    h.sec.hidden = false;
    gsap.set(h.q('.logo'), { opacity: 1 });
    gsap.set(h.q('.mv__escuro'), { opacity: .62 });
    i < heads.length - 1 ? mostraReel(h, 0) : mostraFinal(h);
  });
  const ultima = heads[heads.length - 1];
  requestAnimationFrame(() => scrollTo(0, ultima.sec.offsetTop));
}

addEventListener('resize', () => {
  if (document.body.contains(loading)) { tracosLoading = fazRegua($('#reguaLoading')); desenhaProgresso(); }
  heads.forEach(h => { if (h.tracos.length) h.tracos = fazRegua(h.q('.mv__barra .regua')); });
});

/* ---------- arranque ---------- */
if (Q.has('saltar')) saltar(); else carregar();
</script>
