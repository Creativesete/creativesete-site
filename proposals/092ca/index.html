<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>A World Made by Many · Proposta CreativeSete</title>
<meta name="description" content="Proposta de cobertura de vídeo do jantar de lançamento da campanha A World Made by Many, no Viceroy at Ombria Algarve.">
<link rel="icon" href="/assets/mark7_dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#141414; --muted:#5C5C58; --faint:#98948C;
  --bg:#FFFFFF; --bg2:#F6F5F2;
  --ouro:#B08D57;
  --linha:rgba(20,20,20,.12);
  --cond:'Oswald',system-ui,sans-serif; --sans:'Manrope',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.cond{font-family:var(--cond);text-transform:uppercase;font-weight:500;letter-spacing:.06em;line-height:1.08}
h1,h2{font-family:var(--cond);text-transform:uppercase;font-weight:500;letter-spacing:.05em;line-height:1.06}
.wrap{width:min(1240px,92vw);margin:0 auto}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:var(--ouro)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--cond);font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:15px 34px;border:1px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;transition:all .3s ease}
.btn:hover{background:var(--ink);color:#fff}
.btn.cheio{background:var(--ink);color:#fff}
.btn.cheio:hover{background:transparent;color:var(--ink)}
.btn.claro{border-color:rgba(255,255,255,.85);color:#fff}
.btn.claro:hover{background:#fff;color:var(--ink)}
.btn.claro.cheio{background:#fff;color:var(--ink);border-color:#fff}
.btn.claro.cheio:hover{background:transparent;color:#fff}

/* Reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.22,.7,.3,1),transform 1s cubic-bezier(.22,.7,.3,1);transition-delay:var(--d,0s)}
.rv.on{opacity:1;transform:none}
.zi{overflow:hidden}
.zi img{transform:scale(1.08);transition:transform 1.6s cubic-bezier(.22,.7,.3,1)}
.zi.on img{transform:scale(1)}
.hdr .eyebrow{position:relative;display:inline-block;padding-bottom:14px}
.hdr .eyebrow::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;background:var(--ouro);transition:width 1s ease .35s,left 1s ease .35s}
.hdr.on .eyebrow::after{width:46px;left:calc(50% - 23px)}
.wipe{clip-path:inset(0 100% 0 0);transition:clip-path 1.3s cubic-bezier(.22,.7,.3,1)}
.wipe.on{clip-path:inset(0 0 0 0)}

/* ===== TOP CreativeSete ===== */
.nav{position:fixed;inset:14px 0 auto;z-index:100;pointer-events:none}
.nav-bar{pointer-events:auto;display:flex;align-items:center;gap:22px;width:min(1240px,94vw);margin:0 auto;padding:10px 12px 10px 22px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(20,20,20,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 34px rgba(20,20,20,.1)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800}
.brand img{height:20px;width:auto}
.brand .para{font-weight:500;font-size:12.5px;color:var(--muted);border-left:1px solid var(--linha);padding-left:12px}
.nav-links{display:flex;gap:22px;margin-left:8px;font-size:13px;font-weight:600;color:var(--muted)}
.nav-links a:hover{color:var(--ink)}
.nav-cta{margin-left:auto}
.nav-cta .btn{border-radius:999px;padding:12px 24px;font-size:11px}

/* ===== Heroi cinematografico ===== */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden}
.hero video,.hero .hposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.35),rgba(10,10,10,.14) 45%,rgba(10,10,10,.55))}
.hero .in{position:relative;z-index:2;padding:120px 20px;max-width:900px}
.hero .eyebrow{color:#E5CFA6}
.hero h1{font-size:clamp(40px,6.4vw,86px);margin-top:22px;text-shadow:0 4px 40px rgba(0,0,0,.35)}
.hero .sub{margin-top:20px;font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.hero .cta{margin-top:38px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.hero .in>*{opacity:0;transform:translateY(24px);animation:entra 1.1s cubic-bezier(.22,.7,.3,1) forwards}
.hero h1{animation-delay:.15s}.hero .sub{animation-delay:.3s}.hero .cta{animation-delay:.45s}
@keyframes entra{to{opacity:1;transform:none}}
.seta{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:2;color:rgba(255,255,255,.75);animation:desce 2.2s ease-in-out infinite}
.seta svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes desce{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}

/* ===== Intro branca ===== */
.intro{padding:130px 0 120px;text-align:center}
.intro h2{font-size:clamp(34px,4.6vw,62px);margin-top:20px}
.intro p{max-width:560px;margin:26px auto 0;font-size:14.5px;color:var(--muted)}
.intro .assina{margin-top:26px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}

/* ===== Mosaico com moldura ===== */
.terr{padding:20px 0 90px}
.terr .hdr{max-width:760px;margin:0 auto 56px;text-align:center}
.terr .hdr h2{font-size:clamp(30px,4vw,54px);margin-top:20px}
.mosaico{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;max-width:1160px;margin:0 auto}
.mcard{border-top:1px solid var(--linha);padding-top:24px}
.mcard .moldura{overflow:hidden;position:relative;margin-top:16px}
.mcard img{width:100%;height:300px;object-fit:cover;transition:transform 1.4s cubic-bezier(.22,.7,.3,1),filter .6s ease}
.mcard:hover img{transform:scale(1.05);filter:brightness(1.04)}
.mcard .mtxt{padding:18px 0 0}
.mcard .rom{font-family:var(--cond);font-size:12px;letter-spacing:.3em;color:var(--ouro)}
.mcard h3{font-family:var(--cond);text-transform:uppercase;font-weight:500;letter-spacing:.07em;font-size:17px;margin-top:0}
.mcard p{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.65}
.mcard .fmt{margin-top:12px;font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}

/* ===== Full bleed ===== */
.bleed{position:relative;min-height:92svh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden;margin:80px 0}
.bleed .bimg{position:absolute;inset:0;width:100%;height:112%;object-fit:cover;will-change:transform}
.bleed::after{content:"";position:absolute;inset:0;background:rgba(10,10,10,.34)}
.bleed .in{position:relative;z-index:2;padding:60px 20px;max-width:860px}
.bleed h2{font-size:clamp(32px,4.8vw,64px);text-shadow:0 4px 40px rgba(0,0,0,.4)}
.bleed p{margin-top:18px;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.85)}
.bleed .eyebrow{color:#E5CFA6}
.bleed h2{margin-top:18px}

/* ===== Parceria (4 passos) ===== */
.motor{padding:120px 0 110px;text-align:center}
.motor h2{font-size:clamp(30px,4vw,54px);margin-top:20px}
.motor .lead{max-width:520px;margin:22px auto 0;font-size:14px;color:var(--muted)}
.passos{display:grid;grid-template-columns:repeat(4,1fr);gap:0;max-width:1140px;margin:64px auto 0;border-top:1px solid var(--linha)}
.passo{padding:34px 26px 6px;border-left:1px solid var(--linha);text-align:left}
.passo:first-child{border-left:0}
.passo .n{font-family:var(--cond);font-size:13px;letter-spacing:.3em;color:var(--ouro)}
.passo h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-weight:500;font-size:17px;margin-top:10px}
.passo p{margin-top:10px;font-size:13px;color:var(--muted)}

/* ===== CreativeSete: sala escura ===== */
.nos{position:relative;padding:130px 0;text-align:center;background:#0C0C0C;color:#F2EDE4;overflow:hidden}
.nos::before{content:"";position:absolute;inset:0;background:radial-gradient(60vw 40vw at 50% 0%,rgba(176,141,87,.12),transparent 60%)}
.nos .in{position:relative;z-index:2;max-width:680px;margin:0 auto}
.nos h2{font-size:clamp(30px,4vw,54px);margin-top:20px}
.nos .lead{margin:22px auto 0;font-size:14px;color:#A8A399;max-width:56ch}
.reel{position:relative;z-index:2;max-width:960px;margin:56px auto 0;aspect-ratio:21/9;overflow:hidden;cursor:pointer;border:1px solid rgba(176,141,87,.45);border-radius:22px;padding:10px;background:rgba(255,255,255,.03)}
.reel .rimg{position:absolute;inset:10px;overflow:hidden;border-radius:14px}
.reel img{width:100%;height:100%;object-fit:cover;filter:saturate(.9);transition:transform 1.6s cubic-bezier(.22,.7,.3,1),filter .6s ease}
.reel:hover img{transform:scale(1.05);filter:saturate(1.05)}
.reel::after{content:"";position:absolute;inset:10px;border-radius:14px;background:linear-gradient(180deg,rgba(8,8,8,.05) 40%,rgba(8,8,8,.55));pointer-events:none}
.anel{position:absolute;z-index:3;top:50%;left:50%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;border:1px solid rgba(229,207,166,.85);background:rgba(8,8,8,.35);display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .3s ease,transform .3s ease}
.anel::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(229,207,166,.5);animation:pulso 2.8s ease-out infinite}
.anel svg{width:26px;height:26px;fill:#E5CFA6;margin-left:4px}
.reel:hover .anel{background:rgba(176,141,87,.45);transform:translate(-50%,-50%) scale(1.07)}
@keyframes pulso{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
.rlbl{position:absolute;z-index:3;left:0;right:0;bottom:26px;font-family:var(--cond);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(242,237,228,.85);pointer-events:none}
.quotes{display:grid;grid-template-columns:1fr auto 1fr;gap:44px;align-items:start;max-width:920px;margin:74px auto 0;position:relative;z-index:2;text-align:left}
.quotes .risca{width:1px;height:100%;background:rgba(176,141,87,.35)}
.quote .topo{display:flex;align-items:center;gap:14px}
.quote .avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid rgba(176,141,87,.55);padding:2px;background:#0C0C0C}
.quote .stars{color:var(--ouro);letter-spacing:4px;font-size:12px}
.quote q{quotes:"“" "”";display:block;margin-top:12px;font-size:13.5px;line-height:1.75;color:#DDD8CE;font-weight:500}
.quote .quem{margin-top:12px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8A857C}

/* ===== Proximidade ===== */
.prox{padding:120px 0;background:var(--bg)}
.prox .grid{display:grid;grid-template-columns:5fr 6fr;gap:70px;align-items:center;max-width:1080px;margin:0 auto}
.pvid{position:relative;justify-self:center;width:min(380px,84vw);aspect-ratio:9/16;border:1px solid rgba(176,141,87,.5);border-radius:24px;padding:10px;background:var(--bg2)}
.pvid video{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:cover;border-radius:16px}
.psom{position:absolute;right:22px;bottom:22px;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(10,10,10,.45);color:#fff;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .3s}
.psom:hover{background:rgba(176,141,87,.6)}
.psom svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prox .txt .eyebrow{position:relative;display:inline-block;padding-bottom:14px}
.prox h2{font-size:clamp(28px,3.6vw,48px);margin-top:16px}
.prox .txt p{margin-top:18px;font-size:14.5px;color:var(--muted);max-width:46ch}
.prox .assin{margin-top:24px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);font-weight:700}
.prox .assin span{display:block;margin-top:4px;color:var(--faint);font-weight:600;font-size:10px}

/* ===== A nossa ideia ===== */
.caminhos{padding:120px 0 110px;text-align:center}
.caminhos h2{font-size:clamp(30px,4vw,54px);margin-top:20px}
.caminhos .lead{max-width:620px;margin:24px auto 0;font-size:14px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:56px;max-width:1080px;margin:60px auto 0;text-align:left}
.cam{position:relative;padding-top:26px;transition:transform .5s cubic-bezier(.22,.7,.3,1)}
.cam:hover{transform:translateY(-6px)}
.cam h3{transition:color .4s ease}
.cam:hover h3{color:var(--ouro)}
.cam li{transition:padding-left .35s ease}
.cam:hover li{padding-left:6px}
.cam::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--linha)}
.cam::after{content:"";position:absolute;top:0;left:0;width:0;height:1px;background:var(--ouro);transition:width .9s cubic-bezier(.22,.7,.3,1)}
.cam:hover::after{width:100%}
.cam.rec::after{width:100%}
.cam .lbl{font-family:var(--cond);font-size:11px;letter-spacing:.3em;color:var(--ouro)}
.cam h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-weight:500;font-size:20px;margin-top:10px}
.cam .mote{margin-top:4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.cam ul{margin:18px 0 0;padding:0;list-style:none}
.cam li{padding:10px 0;border-top:1px solid var(--linha);font-size:12.5px;color:var(--muted);line-height:1.6}
.cam li:first-child{border-top:0}
.cam.rec h3::after{content:"O modelo que pediram";display:block;font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.24em;color:var(--ouro);margin-top:6px}
.cnota{max-width:620px;margin:64px auto 0;font-size:14px;color:var(--muted)}
.cnota b{color:var(--ink)}

/* ===== Fecho ===== */
.fecho{position:relative;min-height:92svh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden}
.fecho .bimg{position:absolute;inset:0;width:100%;height:112%;object-fit:cover;will-change:transform}
.fecho::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.3),rgba(10,10,10,.55))}
.fecho .in{position:relative;z-index:2;padding:60px 20px;max-width:820px}
.fecho .eyebrow{color:#E5CFA6}
.fecho h2{font-size:clamp(34px,5vw,68px);margin-top:20px;text-shadow:0 4px 40px rgba(0,0,0,.4)}
.fecho p{margin-top:20px;font-size:14px;color:rgba(255,255,255,.88);max-width:52ch;margin-left:auto;margin-right:auto}
.fecho .agenda{margin:26px auto 0;padding:0;list-style:none;display:inline-grid;gap:8px;counter-reset:ag;text-align:left}
.fecho .agenda li{display:flex;gap:12px;font-size:13.5px;color:rgba(255,255,255,.92)}
.fecho .agenda li::before{counter-increment:ag;content:"0" counter(ag);font-family:var(--cond);color:#E5CFA6}
.fecho .cta{margin-top:36px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.rodape{background:#0E0E0E;color:#8F8B84;padding:26px 0;font-size:12px}
.rodape .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.rodape a{color:#D8D4CC}
.rodape a:hover{color:#fff}

/* ===== Modal video ===== */
.vmodal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.vmodal.on{display:flex}
.vscrim{position:absolute;inset:0;background:rgba(8,8,8,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.vbox{position:relative;width:min(980px,94vw);aspect-ratio:16/9;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.vmodal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vclose{position:absolute;top:12px;right:12px;z-index:4;width:42px;height:42px;border-radius:50%;background:rgba(10,10,10,.6);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;line-height:1}
.vclose:hover{background:rgba(10,10,10,.85)}

@media (max-width:980px){
  .nav-links{display:none}
  .passos{grid-template-columns:1fr 1fr}
  .passo{border-left:0;border-top:1px solid var(--linha)}
  .mosaico{grid-template-columns:1fr 1fr}
  .cgrid{grid-template-columns:1fr;gap:40px}
  .quotes{grid-template-columns:1fr}
}
@media (max-width:820px){
  .prox .grid{grid-template-columns:1fr;gap:44px}
  .mosaico{grid-template-columns:1fr 1fr;gap:22px}
  .mcard img{height:44vw}
  .quotes{grid-template-columns:1fr;gap:30px}
  .quotes .risca{display:none}
  .reel{aspect-ratio:16/9}
  .bleed,.fecho{min-height:70svh}
}
@media (max-width:560px){
  .brand .para{display:none}
  .intro,.motor,.caminhos{padding:90px 0 80px}
  .nos{padding:100px 0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv,.hero .in>*{opacity:1;transform:none;transition:none;animation:none}
  .zi img{transform:none;transition:none}
  .seta{animation:none}
  .bleed .bimg,.fecho .bimg{height:100%}
}


/* ===== O que ouvimos ===== */
.ouvimos{padding:130px 0 110px;text-align:center}
.ouvimos blockquote{font-family:var(--cond);text-transform:uppercase;font-weight:500;letter-spacing:.05em;line-height:1.1;font-size:clamp(30px,4.4vw,58px);max-width:980px;margin:26px auto 0}
.ouvimos blockquote .d{color:var(--ouro)}
.ouvimos .quem{margin-top:22px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.ouvimos p.t{max-width:600px;margin:36px auto 0;font-size:14.5px;color:var(--muted)}
.ecos{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px;margin:34px auto 0}
.ecos span{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:9px 16px;border:1px solid var(--linha);border-radius:999px;color:var(--ink);transition:border-color .4s ease,color .4s ease}
.ecos span:hover{border-color:var(--ouro);color:var(--ouro)}

/* ===== Guia da campanha ===== */
.guia{background:#74302A;color:#F4EEE6;padding:130px 0 120px}
.guia .eyebrow{color:#E9C9A8}
.guia .top{max-width:900px;margin:0 auto;text-align:center}
.guia blockquote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(32px,4.2vw,56px);line-height:1.15;margin-top:24px}
.guia .fonte{margin-top:18px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(244,238,230,.6)}
.guia .intro-g{max-width:600px;margin:30px auto 0;font-size:14.5px;color:rgba(244,238,230,.85)}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:70px;max-width:1080px;margin:70px auto 0}
.gcols h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-weight:500;font-size:13px;color:#E9C9A8;padding-bottom:16px;border-bottom:1px solid rgba(244,238,230,.25)}
.gcols ol{list-style:none;counter-reset:g}
.gcols li{counter-increment:g;display:grid;grid-template-columns:40px 1fr;gap:8px;padding:14px 0;border-bottom:1px solid rgba(244,238,230,.14);font-size:13.5px;color:rgba(244,238,230,.85)}
.gcols li::before{content:"(" counter(g) ")";font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:16px;color:#E9C9A8}
.gcols li b{display:block;font-weight:700;color:#F4EEE6}
.gcols .nao li::before{content:"×";font-family:var(--sans);font-style:normal;font-size:14px}

/* ===== A noite (linha do tempo) ===== */
.noite{padding:40px 0 110px}
.noite .hdr{max-width:760px;margin:0 auto 60px;text-align:center}
.noite .hdr h2{font-size:clamp(30px,4vw,54px);margin-top:20px}
.noite .hdr .lead{max-width:560px;margin:22px auto 0;font-size:14px;color:var(--muted)}
.linha{position:relative;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.linha::before{content:"";position:absolute;left:0;right:0;top:34px;height:1px;background:var(--linha)}
.linha .fio{position:absolute;left:0;top:34px;height:1px;width:0;background:var(--ouro);transition:width 2.4s cubic-bezier(.22,.7,.3,1) .2s}
.linha.on .fio{width:100%}
.mom{position:relative;padding:0 16px;text-align:left}
.mom .h{font-family:var(--cond);font-size:13px;letter-spacing:.22em;color:var(--ouro)}
.mom .pt{width:11px;height:11px;border-radius:50%;background:var(--bg);border:1px solid var(--ouro);margin:14px 0 20px;position:relative;z-index:2;transition:background .6s ease}
.linha.on .mom .pt{background:var(--ouro)}
.mom h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;font-weight:500;font-size:16px}
.mom p{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6}
.mom.chave h3{color:var(--ouro)}
.mom.chave h3::after{content:"O momento da noite";display:block;font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.24em;margin-top:6px}

/* ===== Entregas ===== */

.entregas .hdr{max-width:760px;margin:0 auto 56px;text-align:center}
.entregas .hdr h2{font-size:clamp(30px,4vw,54px);margin-top:20px}
.entregas .hdr .lead{max-width:560px;margin:22px auto 0;font-size:14px;color:var(--muted)}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;max-width:1120px;margin:0 auto}
.ent{background:var(--bg);border:1px solid var(--linha);padding:34px 30px 30px;position:relative;transition:transform .5s cubic-bezier(.22,.7,.3,1),border-color .5s ease,box-shadow .5s ease}

.ent .quando{font-family:var(--cond);font-size:11px;letter-spacing:.28em;color:var(--ouro)}
.ent h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;font-weight:500;font-size:21px;margin-top:10px}
.ent .fmt{margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.ent p{margin-top:16px;font-size:13px;color:var(--muted)}
.ent.destaque{background:#0C0C0C;border-color:#0C0C0C;color:#F2EDE4}
.ent.destaque p{color:#B5B0A6}
.ent.destaque .fmt{color:#8A857C}
.ent .selo{position:absolute;top:-11px;right:24px;background:var(--ouro);color:#fff;font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;padding:5px 12px}
.enota{max-width:760px;margin:48px auto 0;text-align:center;font-size:13.5px;color:var(--muted)}
.enota b{color:var(--ink)}

/* ===== Equipa no terreno ===== */
.terreno{padding:110px 0}
.terreno .grid{display:grid;grid-template-columns:6fr 5fr;gap:70px;align-items:center;max-width:1100px;margin:0 auto}
.terreno .foto{overflow:hidden;aspect-ratio:4/5;border:1px solid rgba(176,141,87,.45);padding:10px;background:var(--bg2)}
.terreno .foto img{width:100%;height:100%;object-fit:cover}
.terreno h2{font-size:clamp(28px,3.6vw,48px);margin-top:16px}
.terreno ul{list-style:none;margin-top:26px}
.terreno li{padding:14px 0;border-top:1px solid var(--linha);font-size:13.5px;color:var(--muted);display:grid;grid-template-columns:34px 1fr;gap:10px}
.terreno li b{display:block;color:var(--ink);font-weight:700;font-size:13.5px}
.terreno li .n{font-family:var(--cond);color:var(--ouro);font-size:13px;letter-spacing:.2em}

/* ===== Investimento ===== */
.inv{padding:120px 0 110px;text-align:center}

.ivlinha:first-child{border-top:0}
.ivlinha.base{background:var(--bg2)}
.ivlinha h3{font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;font-weight:500;font-size:18px}
.ivlinha p{margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.6}
.ivlinha .val{font-family:var(--cond);font-size:22px;letter-spacing:.04em;white-space:nowrap;text-align:right}
.ivlinha .val small{display:block;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
.tog{width:46px;height:26px;border-radius:999px;border:1px solid var(--linha);background:var(--bg2);position:relative;cursor:pointer;transition:background .35s ease,border-color .35s ease;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.22,.7,.3,1)}
.tog[aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro)}
.tog[aria-pressed="true"]::after{transform:translateX(20px)}
.ivlinha .inc{font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--ouro);width:46px;text-align:center}
.ivlinha .ref{display:block;font-size:15px;color:var(--faint);text-decoration-thickness:1px}
.ivlinha .refr{color:var(--ouro)!important;margin-top:4px}
.ivlinha.oferta{background:rgba(176,141,87,.06)}
.ivlinha.oferta .val{font-size:16px;color:var(--ouro)}
.ivlinha .dest{margin:0 0 6px!important;font-size:9px!important;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--ouro)!important}
.ivlinha.opc.ativo{background:rgba(176,141,87,.07)}
.ivtotal{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding:30px;background:#0C0C0C;color:#F2EDE4}
.ivtotal .rot{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#E5CFA6}
.ivtotal .det{margin-top:8px;font-size:12px;color:#A8A399}
.ivtotal .num{font-family:var(--cond);font-size:clamp(34px,4.4vw,52px);letter-spacing:.03em;line-height:1;text-align:right}
.ivtotal .num small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:#A8A399;margin-top:8px}
.cond-g{max-width:880px;margin:44px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:0;text-align:left;border-top:1px solid var(--linha)}
.cond-g div{padding:22px 22px 4px 0}
.cond-g b{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-weight:500;font-size:12px;color:var(--ouro)}
.cond-g span{display:block;margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6}

/* ===== Depois de dia 8 ===== */
.nav-links a{white-space:nowrap}
@media (max-width:1120px){.nav-links{display:none}}
.depois{padding:20px 0 110px}
.depois .hdr{max-width:760px;margin:0 auto 56px;text-align:center}

@media (max-width:980px){

  .terreno .grid{grid-template-columns:1fr;gap:44px}

}
@media (max-width:620px){

  .ivtotal .num{text-align:left}

  .ouvimos,.inv,.entregas{padding:90px 0 80px}
}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const milhar = (n, d) => { const [i, f] = n.toFixed(d).split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (f ? ',' + f : ''); };
const eur = n => '€ ' + milhar(n, 0);
const eur2 = n => '€ ' + milhar(n, 2);

document.querySelectorAll('[data-t]').forEach(el => {
  const v = el.dataset.t.split('.').reduce((o,k) => o && o[k], PROPOSTA);
  if (v == null) return;
  if (el.dataset.html) el.innerHTML = v; else el.textContent = v;
});

const gli = l => l.map(x => `<li><span><b>${esc(x.t)}</b>${esc(x.p)}</span></li>`).join('');
$('#gsim').innerHTML = gli(PROPOSTA.guia.sim);
$('#gnao').innerHTML = gli(PROPOSTA.guia.nao);
$('#ecos').innerHTML = PROPOSTA.ouv.ecos.map(e => `<span>${esc(e)}</span>`).join('');

$('#linha').insertAdjacentHTML('beforeend', PROPOSTA.noite.momentos.map((m,i) => `
  <div class="mom rv${m.chave ? ' chave' : ''}" style="--d:${i*.12}s">
    <p class="h">${esc(m.h)}</p><div class="pt"></div>
    <h3>${esc(m.t)}</h3><p>${esc(m.p)}</p>
  </div>`).join(''));

$('#egrid').innerHTML = PROPOSTA.ent.pecas.map((e,i) => `
  <article class="ent rv${e.destaque ? ' destaque' : ''}" style="--d:${i*.12}s">
    ${e.selo ? `<span class="selo">${esc(e.selo)}</span>` : ''}
    <p class="quando">${esc(e.quando)}</p>
    <h3>${esc(e.t)}</h3>
    <p class="fmt">${esc(e.fmt)}</p>
    <p>${esc(e.p)}</p>
  </article>`).join('');

$('#eqlista').innerHTML = PROPOSTA.eq.lista.map((l,i) => `<li><span class="n">0${i+1}</span><span><b>${esc(l.t)}</b>${esc(l.p)}</span></li>`).join('');

/* Investimento com opcionais */
const inv = PROPOSTA.inv, ativos = new Set();
$('#ivbox').innerHTML = `
  <div class="ivlinha base"><span class="inc">Incl.</span><div><h3>${esc(inv.base.t)}</h3><p>${esc(inv.base.p)}</p></div><div class="val"><s class="ref">${eur(inv.base.ref)}</s>${eur(inv.base.v)}<small>+ IVA</small><small class="refr">${esc(inv.base.refRot)}</small></div></div>
  ${inv.ofertas.map(o => `<div class="ivlinha oferta"><span class="inc">Oferta</span><div><h3>${esc(o.t)}</h3><p>${esc(o.p)}</p></div><div class="val">Incluído<small>primeira colaboração</small></div></div>`).join('')}
  ${inv.opcionais.map(o => `
  <div class="ivlinha opc" data-op="${esc(o.id)}"><button class="tog" type="button" aria-pressed="false" aria-label="Adicionar ${esc(o.t)}"></button><div>${o.destaque ? `<p class="dest">${esc(o.destaque)}</p>` : ''}<h3>${esc(o.t)}</h3><p>${esc(o.p)}</p></div><div class="val">${o.ref ? `<s class="ref">${eur(o.ref)}</s>` : ''}+ ${eur(o.v)}<small>+ IVA · opcional</small></div></div>`).join('')}
  <div class="ivtotal"><div><p class="rot">Total da proposta</p><p class="det" id="ivdet"></p></div><div class="num" id="ivnum"></div></div>`;
function totais(){
  const sub = inv.base.v + inv.opcionais.filter(o => ativos.has(o.id)).reduce((s,o) => s + o.v, 0);
  const iva = sub * PROPOSTA.iva;
  $('#ivnum').innerHTML = `${eur(sub)} <small>+ IVA · ${eur2(sub + iva)} com IVA</small>`;
  const nomes = inv.opcionais.filter(o => ativos.has(o.id)).map(o => o.t.toLowerCase());
  $('#ivdet').textContent = nomes.length ? 'Cobertura e edição, com ' + nomes.join(' e ') : 'Cobertura e edição · ative os opcionais acima para os somar';
}
document.querySelectorAll('.ivlinha.opc').forEach(l => l.addEventListener('click', () => {
  const id = l.dataset.op, b = l.querySelector('.tog');
  ativos.has(id) ? ativos.delete(id) : ativos.add(id);
  b.setAttribute('aria-pressed', ativos.has(id)); l.classList.toggle('ativo', ativos.has(id));
  totais();
}));
totais();
$('#condg').innerHTML = inv.condicoes.map(c => `<div><b>${esc(c.t)}</b><span>${esc(c.p)}</span></div>`).join('');

$('#mosaico').innerHTML = PROPOSTA.dep.pilares.map((t,i) => `
  <article class="mcard rv" style="--d:${i*.12}s">
    <p class="rom">${esc(t.rom)} · <span style="color:var(--ink)">${esc(t.t)}</span></p>
    <figure class="moldura zi"><img src="/proposals/viceroy-ombria/img/${esc(t.img)}" alt="${esc(t.alt)}" loading="lazy"></figure>
    <div class="mtxt"><p>${esc(t.p)}</p><p class="fmt">${esc(t.fmt)}</p></div>
  </article>`).join('');

$('#quotes').innerHTML = PROPOSTA.quotes.map((q,i) => `${i ? '<div class="risca" aria-hidden="true"></div>' : ''}<div class="quote"><div class="topo"><img class="avatar" src="${esc(q.foto)}" alt="${esc(q.nome.split(' ·')[0])}" loading="lazy"><div class="stars" aria-label="5 estrelas">★★★★★</div></div><q>${esc(q.txt)}</q><p class="quem">${esc(q.nome)}</p></div>`).join('');
$('#agenda').innerHTML = PROPOSTA.fecho.agenda.map(a => `<li>${esc(a)}</li>`).join('');

function assunto(){
  const nomes = inv.opcionais.filter(o => ativos.has(o.id)).map(o => o.t);
  return PROPOSTA.assuntoEmail + (nomes.length ? ' · com ' + nomes.join(' e ') : '');
}
document.querySelectorAll('[data-mail]').forEach(a => a.addEventListener('click', () => { a.href = `mailto:${PROPOSTA.contacto.email}?subject=${encodeURIComponent(assunto())}`; }));
document.querySelectorAll('[data-mail]').forEach(a => a.href = `mailto:${PROPOSTA.contacto.email}?subject=${encodeURIComponent(PROPOSTA.assuntoEmail)}`);
$('#btn-wa').href = `https://wa.me/${PROPOSTA.contacto.tel}?text=${encodeURIComponent('Olá Lucas, vi a proposta para a cobertura de dia 8 no Viceroy at Ombria Algarve.')}`;
const fmtD = s => new Date(s + 'T12:00:00').toLocaleDateString('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' });
$('#rodape-data').textContent = `Proposta preparada a ${fmtD(PROPOSTA.data)} · válida até ${fmtD(PROPOSTA.validade)}`;

/* Heroi */
const hv = document.getElementById('hvid');
if (hv) {
  hv.src = matchMedia('(max-width:820px)').matches ? '/proposals/viceroy-ombria/img/hero_m.mp4' : '/proposals/viceroy-ombria/img/hero.mp4';
  const tenta = () => hv.play().catch(() => {});
  hv.addEventListener('loadeddata', tenta);
  document.addEventListener('touchstart', tenta, { once: true, passive: true });
  document.addEventListener('click', tenta, { once: true });
}

/* Video FPV: carrega quando se aproxima */
const fv = document.getElementById('fpvvid');
if (fv) {
  const ioFv = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    if (!fv.src) fv.src = matchMedia('(max-width:820px)').matches ? '/proposals/092ca/media/fpv_m.mp4' : '/proposals/092ca/media/fpv.mp4';
    fv.play().catch(() => {});
    ioFv.unobserve(fv);
  }), { rootMargin: '400px' });
  ioFv.observe(fv);
}

/* Modal */
const vm = $('#vmodal'), vf = $('#vframe');
function abrir(id){ if (!/^[\w-]{11}$/.test(id)) return; vf.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="Vídeo" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; vm.classList.add('on'); document.body.style.overflow = 'hidden'; }
function fechar(){ vm.classList.remove('on'); vf.innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('click', e => { const c = e.target.closest('[data-video]'); if (c) abrir(c.dataset.video); if (e.target.closest('[data-fechar]')) fechar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });

/* Video pessoal */
const pv = document.getElementById('pvid'), ps = document.getElementById('psom');
if (pv) {
  const ioPv = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    if (!pv.src) { pv.src = pv.dataset.src; }
    pv.play().catch(() => {});
    ioPv.unobserve(pv);
  }), { rootMargin: '300px' });
  ioPv.observe(pv);
}
if (pv && ps) ps.addEventListener('click', () => {
  pv.muted = !pv.muted;
  ps.querySelector('.on').style.display = pv.muted ? 'none' : '';
  ps.querySelector('.off').style.display = pv.muted ? '' : 'none';
  ps.setAttribute('aria-label', pv.muted ? 'Ligar o som' : 'Desligar o som');
  if (!pv.muted) pv.play();
});

/* Reveal */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } }), { threshold: .14 });
document.querySelectorAll('.rv,.zi,.hdr,.wipe,.linha').forEach(el => io.observe(el));

/* Parallax */
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const bs = [...document.querySelectorAll('.bleed .bimg,.fecho .bimg')];
  let tick = false;
  addEventListener('scroll', () => {
    if (tick) return; tick = true;
    requestAnimationFrame(() => {
      bs.forEach(b => {
        const r = b.parentElement.getBoundingClientRect();
        if (r.bottom < 0 || r.top > innerHeight) return;
        const p = (r.top + r.height/2 - innerHeight/2) / innerHeight;
        b.style.transform = `translateY(${p * -46}px)`;
      });
      tick = false;
    });
  }, { passive: true });
}
</script>
